 var dengan_rupiah = document.getElementById('saldo');
    dengan_rupiah.addEventListener('keyup', function(e)
    {
        dengan_rupiah.value = formatRupiah(this.value, 'Rp. ');
    });
    
    
      /* Fungsi */
    function formatRupiah(angka, prefix)
    {
        var number_string = angka.replace(/[^,\d]/g, '').toString(),
            split    = number_string.split(','),
            sisa     = split[0].length % 3,
            rupiah     = split[0].substr(0, sisa),
            ribuan     = split[0].substr(sisa).match(/\d{3}/gi);
            
        if (ribuan) {
            separator = sisa ? '.' : '';
            rupiah += separator + ribuan.join('.');
        }
        
        rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
        return prefix == undefined ? rupiah : (rupiah ? 'Rp. ' + rupiah : '');
    }
            })
            
            
</script>

<script>
        const inputNama = document.getElementById('nomor');
        const tombolKirim = document.getElementById('btnku');

        // Periksa saat pengguna mengetik di form
        inputNama.addEventListener('input', function() {
            if (inputNama.value.trim() !== '') {
                // Jika terisi, ubah warna dan aktifkan tombol
                tombolKirim.classList.add('aktif');
                tombolKirim.removeAttribute('disabled');
            } else {
                // Jika kosong kembali seperti semula
                tombolKirim.classList.remove('aktif');
                tombolKirim.setAttribute('disabled', 'true');
            }
        });
    </script>
